<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deutsch Sprechen & Verstehen</title>
<meta name="theme-color" content="#7A1B2E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.svg">
<link rel="apple-touch-icon" href="icon-192.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F6F1E7;
  --cream-dim:#EFE8D8;
  --ink:#211D18;
  --burgundy:#7A1B2E;
  --burgundy-dark:#551322;
  --gold:#C99A2E;
  --blue:#3B5BA5;
  --line:#DCD3BC;
  --green:#4C7A4C;
  --radius:2px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--cream);
  color:var(--ink);
  font-family:'Work Sans',sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  padding-bottom:64px;
}
h1,h2,h3,.disp{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-0.01em;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  background:var(--burgundy);
  color:var(--cream);
  padding:14px 16px;
  display:flex;align-items:center;gap:10px;
  box-shadow:0 2px 0 var(--burgundy-dark);
}
.topbar .back{
  background:none;border:none;color:var(--cream);
  font-size:20px;padding:2px 6px;line-height:1;
}
.topbar h1{
  font-size:15px;margin:0;flex:1;
  text-transform:uppercase;letter-spacing:.06em;
}
.topbar .sub{font-size:11px;opacity:.85;font-family:'IBM Plex Mono',monospace;}

/* ---------- Home ---------- */
.wrap{max-width:640px;margin:0 auto;padding:18px 16px 8px;}
.hero{
  display:flex;align-items:center;gap:18px;
  padding:22px 4px 8px;
}
.dial{position:relative;width:112px;height:112px;flex-shrink:0;}
.dial svg{width:100%;height:100%;}
.dial .center{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;
}
.dial .center .n{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:26px;}
.dial .center .lbl{font-size:9px;text-transform:uppercase;letter-spacing:.08em;opacity:.65;}
.hero-text h2{font-size:20px;margin:0 0 4px;}
.hero-text p{margin:0;font-size:13px;opacity:.75;line-height:1.5;}

.continue-btn{
  display:flex;align-items:center;justify-content:space-between;
  width:100%;margin-top:6px;
  background:var(--ink);color:var(--cream);
  border:none;border-radius:var(--radius);
  padding:16px 18px;
  font-size:14px;font-weight:600;
}
.continue-btn .arrow{font-size:18px;}
.continue-btn small{display:block;font-weight:400;font-family:'IBM Plex Mono',monospace;font-size:11px;opacity:.7;margin-top:3px;}

.phase-list{margin-top:22px;display:flex;flex-direction:column;gap:10px;}
.phase-card{
  border:1.5px solid var(--ink);
  border-radius:var(--radius);
  background:var(--cream-dim);
  padding:14px 16px;
  display:flex;align-items:center;gap:14px;
}
.phase-card.locked{opacity:.55;}
.phase-shape{width:34px;height:34px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.phase-meta{flex:1;}
.phase-meta .num{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.08em;opacity:.6;}
.phase-meta .title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;margin-top:1px;}
.phase-meta .weeks{font-size:11px;opacity:.65;margin-top:2px;}
.phase-pct{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;}

/* ---------- Week list within a phase ---------- */
.week-row{
  display:flex;align-items:center;gap:12px;
  padding:13px 4px;border-bottom:1px solid var(--line);
}
.week-row:last-child{border-bottom:none;}
.week-check{
  width:26px;height:26px;border-radius:50%;flex-shrink:0;
  border:1.5px solid var(--ink);
  display:flex;align-items:center;justify-content:center;
  font-family:'IBM Plex Mono',monospace;font-size:11px;
}
.week-check.done{background:var(--green);border-color:var(--green);color:#fff;}
.week-check.current{background:var(--gold);border-color:var(--gold);color:var(--ink);}
.week-row-text{flex:1;}
.week-row-text .t{font-size:13.5px;font-weight:600;}
.week-row-text .d{font-size:11px;opacity:.6;font-family:'IBM Plex Mono',monospace;margin-top:1px;}
.week-row-pct{font-size:11px;font-family:'IBM Plex Mono',monospace;opacity:.7;}
.section-title{
  font-family:'Space Grotesk',sans-serif;font-weight:700;
  font-size:12px;text-transform:uppercase;letter-spacing:.09em;
  margin:26px 0 6px;opacity:.7;
}

/* ---------- Week detail tabs ---------- */
.tabbar{
  display:flex;gap:4px;padding:12px 16px 0;max-width:640px;margin:0 auto;
  overflow-x:auto;
}
.tab{
  border:1.5px solid var(--ink);background:none;
  padding:8px 12px;font-size:11.5px;font-weight:600;
  white-space:nowrap;border-radius:var(--radius);
  text-transform:uppercase;letter-spacing:.03em;
}
.tab.active{background:var(--ink);color:var(--cream);}

.week-head{
  padding:16px 16px 10px;max-width:640px;margin:0 auto;
}
.week-head .dates{font-family:'IBM Plex Mono',monospace;font-size:11px;opacity:.6;}
.week-head h2{font-size:19px;margin:4px 0 0;}
.progress-bar{height:5px;background:var(--line);border-radius:3px;margin-top:12px;overflow:hidden;}
.progress-bar-fill{height:100%;background:var(--burgundy);}

.panel{max-width:640px;margin:0 auto;padding:6px 16px 30px;}
.day-block{
  border:1.5px solid var(--ink);border-radius:var(--radius);
  margin-bottom:12px;background:var(--cream-dim);
}
.day-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;
}
.day-head .name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;}
.day-head .lbl{font-size:11px;opacity:.6;margin-left:8px;font-weight:400;font-family:'Work Sans',sans-serif;}
.day-head .count{font-family:'IBM Plex Mono',monospace;font-size:11px;opacity:.7;}
.day-tasks{padding:0 14px 12px;}
.task{
  display:flex;align-items:flex-start;gap:10px;
  padding:7px 0;font-size:13.5px;line-height:1.45;
}
.task input{
  margin-top:3px;width:17px;height:17px;flex-shrink:0;accent-color:var(--burgundy);
}
.task label{flex:1;}
.task.checked label{opacity:.5;text-decoration:line-through;}

.card{
  border:1.5px solid var(--ink);border-radius:var(--radius);
  background:var(--cream-dim);padding:14px 16px;margin-bottom:14px;
}
.card h3{font-size:13px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.05em;}
.note-box{
  border-left:3px solid var(--gold);background:#FBF3DE;
  padding:10px 12px;font-size:12.5px;font-style:italic;line-height:1.5;margin-bottom:12px;
}
.milestone-box{
  border-left:3px solid var(--burgundy);background:#F5E4E7;
  padding:12px 14px;font-size:13px;line-height:1.55;margin-top:8px;
}
.milestone-box b{display:block;margin-bottom:4px;font-family:'Space Grotesk',sans-serif;}
ul.reslist{margin:0;padding-left:18px;font-size:13px;line-height:1.6;}
table.gtable{width:100%;border-collapse:collapse;margin-bottom:12px;font-size:13px;}
table.gtable td{border:1px solid var(--line);padding:6px 8px;}
.gtitle{font-size:12px;font-weight:600;margin:10px 0 4px;}
table.vtable{width:100%;border-collapse:collapse;font-size:13px;}
table.vtable td{border-bottom:1px solid var(--line);padding:7px 4px;}
table.vtable td:first-child{font-weight:600;width:52%;}
.dialogue-line{font-size:13.5px;line-height:1.7;}
.dialogue-line b{color:var(--burgundy);}
.notes-area{
  width:100%;min-height:70px;border:1.5px solid var(--ink);border-radius:var(--radius);
  background:var(--cream);font-family:'Work Sans',sans-serif;font-size:13px;padding:10px;
  resize:vertical;
}

.empty-phase{
  text-align:center;padding:40px 20px;opacity:.7;
}
.empty-phase .glyph{font-size:34px;margin-bottom:10px;}
.empty-phase p{font-size:13px;max-width:320px;margin:6px auto 0;line-height:1.5;}

/* ---------- Bottom nav ---------- */
.bottomnav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:flex;
  background:var(--ink);
  border-top:1.5px solid var(--burgundy-dark);
}
.bottomnav .navbtn{
  flex:1;background:none;border:none;color:var(--cream);
  padding:10px 0 8px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
  opacity:.55;
}
.bottomnav .navbtn.active{opacity:1;color:var(--gold);}
.bottomnav .navbtn .ic{font-size:16px;line-height:1;}

/* ---------- Flashcards ---------- */
.fc-input{
  width:100%;margin-bottom:8px;padding:10px;
  border:1.5px solid var(--ink);border-radius:var(--radius);
  font-family:inherit;font-size:13.5px;box-sizing:border-box;
  background:var(--cream);color:var(--ink);
}
.fc-card-row{
  border:1.5px solid var(--ink);border-radius:var(--radius);
  background:var(--cream-dim);margin-bottom:10px;padding:12px 14px;
}
.fc-card-row .f{font-weight:600;font-size:13.5px;}
.fc-card-row .b{font-size:12.5px;opacity:.7;margin-top:3px;}
.fc-card-row .actions{margin-top:8px;display:flex;gap:10px;}
.fc-smallbtn{
  border:1.5px solid var(--ink);background:none;padding:4px 10px;
  font-size:10.5px;font-weight:600;border-radius:var(--radius);
  text-transform:uppercase;letter-spacing:.03em;
}
.vocab-add-btn{
  border:1.5px solid var(--ink);background:none;padding:3px 8px;
  font-size:11px;font-weight:700;border-radius:var(--radius);line-height:1;
}
.vocab-add-btn:disabled{opacity:.5;}
.study-card{
  margin-top:20px;min-height:170px;display:flex;align-items:center;justify-content:center;
  text-align:center;cursor:pointer;padding:34px 16px;
}
.study-card .lbl{font-size:11px;opacity:.6;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;}
.study-card .txt{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:21px;line-height:1.4;}
.study-answer-row{display:flex;gap:10px;margin-top:16px;}
.study-answer-row .continue-btn{padding:14px 10px;}

::-webkit-scrollbar{display:none;}
.hidden{display:none !important;}

@media (max-width:380px){
  .dial{width:96px;height:96px;}
  .hero{gap:12px;}
}
</style>
</head>

<div id="topbar" class="topbar hidden">
  <button class="back" id="backBtn" aria-label="Back">←</button>

</div>

</div>
<div id="flashView" class="hidden"></div>

<div class="bottomnav" id="bottomNav">

  <button class="navbtn" data-section="flashcards"><span class="ic">&#9636;</span>Flashcards</button>

men!"], ["B", "Echt?! Das ist ja toll, herzlichen Glückwunsch!"], ["A", "Danke! Ich bin total aufgeregt."], ["B", "Das kann ich verstehen. Wann fängst du an?"], ["A", "Nächsten Monat schon. Und stell dir vor — mein alter Kollege Tom hat auch dort angefangen letzte Woche!"], ["B", "Das meinen Sie nicht ernst! Was für ein Zufall!"], ["A", "Ich weiß, kaum zu glauben, oder?"]], "speaking": ["React to three pieces of made-up good news using positive reactions", "React to three surprising statements using disbelief phrases", "Use at least three filler words naturally in an unscripted ramble", "Record reacting to 5 mixed statements with appropriate emotion words"], "selfcheck": ["Use at least 4 different reaction phrases naturally", "React with genuine-sounding surprise or disbelief", "Use filler words without it feeling scripted", "Name at least 5 emotions correctly"], "milestone": null}, {"week": 16, "phase": 3, "dates": "Nov 23 – Nov 29, 2026", "startDate": "2026-11-23", "focus": "Phone Calls, Appointments & Formal Register", "days": [{"day": "Monday", "label": "session 1", "tasks": ["Watch Folge 31 (Mit freundlichen Grüßen) — formal written register", "Learn phone call phrases", "Speaking: role-play answering the phone and stating your purpose"]}, {"day": "Tuesday", "label": "review day", "tasks": ["Anki review", "Re-read the formal/informal table aloud"]}, {"day": "Wednesday", "label": "session 2", "tasks": ["Rewatch A1 Folge 1 (Hallo!) — notice the formal/informal distinction now", "Learn appointment-scheduling phrases", "Speaking: call to schedule/reschedule an appointment"]}, {"day": "Thursday", "label": "review day", "tasks": ["Anki only", "Drill: for 5 random situations, is it du or Sie?"]}, {"day": "Friday", "label": "session 3", "tasks": ["Speaking: record the full phone call dialogue, both roles", "Prep for the Phase 3 milestone: outline a 2-minute story"]}, {"day": "Saturday", "label": "immersion", "tasks": ["Easy German video, any topic"]}, {"day": "Sunday", -12-14", "focus": "Passive Voice — Recognition, Part 1", "days": [{"day": "Monday", "label": "session 1", "tasks": ["Learn passive formation with werden", "Search \"DW Grammatiktrainer Passiv\" for practice", "Translate 3 passive sentences into English to confirm understanding"]}, {"day": "Tuesday", "label": "review day", "tasks": ["Anki review", "Re-read examples aloud"]}, {"day": "Wednesday", "label": "session 2", "tasks": ["Practice recognizing passive in real text — recipes and instructions are full of it", "Speaking: read the practice dialogue aloud, focusing on the pattern"]}, {"day": "Thursday", "label": "review day", "tasks": ["Anki only", "Drill: spot the passive construction in 5 sample sentences"]}, {"day": "Friday", "label": "session 3", "tasks": ["Find a simple German recipe and identify every passive construction", "Full run-through of speaking tasks"]}, {"day": "Saturday", "label": "immersion", "tasks": ["Easy German video, or better, a cooking/instructional video if you can find one"]}, {"day": "Sunday", "label": "buffer / rest", "tasks": ["Self-Check before Week 20"]}], "resourceNote": "No dedicated Nicos Weg episode confirmed. Direct teaching + DW's Grammatiktrainer — but remember the goal is recognition, not production, so the bar this week is lower than usual.", "resources": ["Grammar reference: search \"DW Grammatiktrainer Passiv\" at learngerman.dw.com", "Practice: search for a simple German recipe (\"einfaches Rezept\" + a dish) — recipes are written almost entirely in passive", "Immersion: Easy German video, any topic"], "grammar": [{"title": "Active vs passive", "rows": [["Der Koch kocht das Essen.", "Das Essen wird gekocht."], ["Man repariert das Auto.", "Das Auto wird repariert."]]}, {"title": "Werden — present tense (review from Week 11)", "rows": [["ich werde", "wir werden"], ["du wirst", "ihr werdet"], ["es wird", "sie werden"]]}], "grammarNote": "Passive = [conjugated werden] + ... + [Partizip II at the end]. You already know werden (Futur I, Week 11) and Partizip II (Perfekt, Weeks 5–6) — passive just combines them differently. Passive is everywhere in news, recipes, and instructions: \"Der Verdächtige wurde festgenommen\" (The suspect was arrested).", "vocab": [["Das Gemüse wird geschnitten", "The vegetables are cut"], ["Die Zwiebeln werden gebraten", "The onions are fried"], ["Der Brief wird geschrieben", "The letter is being written"], ["Die Tür wird geöffnet", "The door is opened"], ["Das Auto wird repariert", "The car is being repaired"], ["Die Show wird gezeigt", "The show is being shown"], ["Es wird gesagt, dass...", "It is said that..."]], "vocabNote": null, "dialogue": [["A", "Wie macht man diese Suppe?"], ["B", "Zuerst werden die Zwiebeln geschnitten. Dann werden sie in Öl gebraten."], ["A", "Und danach?"], ["B", "Danach wird Wasser hinzugefügt, und die Suppe wird 20 Minuten gekocht."], ["A", "Klingt einfach! Wird noch etwas hinzugefügt?"], ["B", "Am Ende wird noch Salz und Pfeffer hinzugefügt. Fertig!"]], "speaking": ["Translate three passive sentences into English", "Read the practice dialogue aloud, focusing on the werden + participle pattern", "Find a simple recipe and identify every passive construction", "Say two passive sentences about a process you know well"], "selfcheck": ["Recognize passive voice when reading (werden + participle at the end)", "Correctly translate a passive sentence into English", "Understand why passive shifts focus away from who's doing the action", "Spot passive constructions in a real recipe or instructions"], "milestone": null}, {"week": 20, "phase": 4, "dates": "Dec 21 – Dec 27, 2026", "startDate": "2026-12-21", "focus": "Passive Voice — Recognition, Part 2", "days": [{"day": "Monday", "label": "session 1 — keep it short", "tasks": ["Learn passive in Perfekt (recognition only)", "Read the examples aloud once"]}, {"day": "Tuesday", "label": "optional review", "tasks": ["Anki review if time allows; skip if the holidays are busy"]}, {"day": "Wednesday", " <script>
(function(){
  "use strict";
  const CURRICULUM = JSON.parse(document.getElementById('curriculum-data').textContent);
  const TOTAL_WEEKS_PLANNED = 24;
  const STORAGE_KEY = 'deutsch-tracker-progress-v1';
  const PHASE_INFO = {
    1: {title:"Survival Conversation", weeks:"Weeks 1–4"},
    2: {title:"Everyday Fluency", weeks:"Weeks 5–10"},
    3: {title:"Expressive & Social German", weeks:"Weeks 11–16"},
    4: {title:"Real-World Immersion", weeks:"Weeks 17–24"},
  };

  // ---------- storage ----------
  const STATE_DEFAULTS = {tasks:{}, notes:{}, lastWeek:null, lastTab:'days', collections:[], cards:[]};
  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return Object.assign({}, STATE_DEFAULTS);
      const parsed = JSON.parse(raw);
      return Object.assign({}, STATE_DEFAULTS, parsed);
    }catch(e){ return Object.assign({}, STATE_DEFAULTS); }
  }
  let STATE = loadState();
  function saveState(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
  }

  // ---------- flashcards data ----------
  function genId(prefix){
    return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }
  function getCollections(){ return STATE.collections || []; }
  function findCollection(id){ return getCollections().find(c => c.id === id); }
  function collectionCardCount(id){ return (STATE.cards||[]).filter(c => c.collectionId === id).length; }
  function getCardsFor(collectionIds){ return (STATE.cards||[]).filter(c => collectionIds.includes(c.collectionId)); }
  function addCollection(name){
    const col = {id: genId('col-'), name: name.trim()};
    STATE.collections = STATE.collections || [];
    STATE.collections.push(col);
    saveState();
    return col;
  }
  function findOrCreateCollectionByName(name){
    let col = getCollections().find(c => c.name.toLowerCase() === name.toLowerCase());
    if(!col){
      STATE.collections = STATE.collections || [];
      col = {id: genId('col-'), name};
      STATE.collections.push(col);
    }
    return col;
  }
  function renameCollection(id, name){
    const col = findCollection(id);
    if(col){ col.name = name.trim(); saveState(); }
  }
  function deleteCollection(id){
    STATE.collections = getCollections().filter(c => c.id !== id);
    STATE.cards = (STATE.cards||[]).filter(c => c.collectionId !== id);
    saveState();
  }
  function addCard(collectionId, front, back){
    const card = {id: genId('card-'), collectionId, front: front.trim(), back: back.trim()};
    STATE.cards = STATE.cards || [];
    STATE.cards.push(card);
    saveState();
    return card;
  }
  function updateCard(id, front, back){
    const c = (STATE.cards||[]).find(c => c.id === id);
    if(c){ c.front = front.trim(); c.back = back.trim(); saveState(); }
  }
  function deleteCard(id){
    STATE.cards = (STATE.cards||[]).filter(c => c.id !== id);
    saveState();
  }
  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    return arr;
  }

  // ---------- task id helpers ----------
  function dayTaskId(week, dayIdx, taskIdx){ return `w${week}-d${dayIdx}-t${taskIdx}`; }
  function speakTaskId(week, idx){ return `w${week}-speak-${idx}`; }
  function selfTaskId(week, idx){ return `w${week}-self-${idx}`; }

  function weekTaskIds(w){
    const ids = [];
    w.days.forEach((d, di) => d.tasks.forEach((t, ti) => ids.push(dayTaskId(w.week, di, ti))));
    (w.speaking||[]).forEach((_, i) => ids.push(speakTaskId(w.week, i)));
    (w.selfcheck||[]).forEach((_, i) => ids.push(selfTaskId(w.week, i)));
    return ids;
  }
  function weekProgress(w){
    const ids = weekTaskIds(w);
    if(ids.length === 0) return 0;
    const done = ids.filter(id => STATE.tasks[id]).length;
    return done / ids.length;
  }
  function weekIsComplete(w){ return weekProgress(w) >= 0.999; }

  function phaseWeeks(phase){ return CURRICULUM.filter(w => w.phase === phase); }
  function phaseProgress(phase){
    const ws = phaseWeeks(phase);
    if(ws.length === 0) return 0;
    const sum = ws.reduce((a,w) => a + weekProgress(w), 0);
    return sum / ws.length;
  }
  function overallProgress(){
    // out of 24 planned weeks, weeks 17-24 count as 0 until added
    const sum = CURRICULUM.reduce((a,w) => a + weekProgress(w), 0);
    return sum / TOTAL_WEEKS_PLANNED;
  }

  function todayISO(){
    const d = new Date();
    return d.toISOString().slice(0,10);
  }
  function findCurrentWeekByDate(){
    const today = todayISO();
    let match = null;
    for(const w of CURRICULUM){
      if(today >= w.startDate){ match = w; }
    }
    return match;
  }
  function findResumeWeek(){
    // first incomplete week in order; fallback to date-based; fallback to week 1
    for(const w of CURRICULUM){
      if(!weekIsComplete(w)) return w;
    }
    return findCurrentWeekByDate() || CURRICULUM[0];
  }

  // ---------- rendering: dial ----------
  function renderDial(pct){
    const r = 50, cx = 56, cy = 56, circumference = 2*Math.PI*r;
    const offset = circumference * (1 - pct);
    return `<svg viewBox="0 0 112 112">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#DCD3BC" stroke-width="10"/>
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#7A1B2E" stroke-width="10"
        stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"
        stroke-linecap="butt" transform="rotate(-90 ${cx} ${cy})"/>
    </svg>`;
  }

  const PHASE_SHAPES = {
    1: `<svg viewBox="0 0 34 34" width="34" height="34"><circle cx="17" cy="17" r="14" fill="#7A1B2E"/></svg>`,
    2: `<svg viewBox="0 0 34 34" width="34" height="34"><polygon points="17,3 31,30 3,30" fill="#C99A2E"/></svg>`,
    3: `<svg viewBox="0 0 34 34" width="34" height="34"><rect x="5" y="5" width="24" height="24" fill="#3B5BA5"/></svg>`,
    4: `<svg viewBox="0 0 34 34" width="34" height="34"><circle cx="17" cy="17" r="14" fill="none" stroke="#211D18" stroke-width="2.5" stroke-dasharray="4 4"/></svg>`,
  };

  // ---------- SECTION ROUTING ----------
  function showSection(section){
    document.querySelectorAll('#bottomNav .navbtn').forEach(b => {
      b.classList.toggle('active', b.dataset.section === section);
    });
    if(section === 'flashcards'){
      renderFlashHome();
    } else {
      document.getElementById('flashView').classList.add('hidden');
      renderHome();
    }
  }

  // ---------- HOME VIEW ----------
  function renderHome(){
    document.getElementById('topbar').classList.add('hidden');
    document.getElementById('weekView').classList.add('hidden');
    document.getElementById('flashView').classList.add('hidden');
    const home = document.getElementById('homeView');
    home.classList.remove('hidden');

    const pct = overallProgress();
    const resumeWeek = findResumeWeek();
    const weeksDone = CURRICULUM.filter(weekIsComplete).length;

    let html = `
      <div class="hero">
        <div class="dial">
          ${renderDial(pct)}
          <div class="center"><div class="n">${weeksDone}/24</div><div class="lbl">weeks</div></div>
        </div>
        <div class="hero-text">
          <h2>Deutsch Sprechen &amp; Verstehen</h2>
          <p>A 24-week self-study German curriculum. Aug 10, 2026 – Jan 24, 2027.</p>
        </div>
      </div>
      <button class="continue-btn" id="continueBtn">
        <span>Continue — Week ${resumeWeek.week}: ${resumeWeek.focus}
          <small>${resumeWeek.dates}</small>
        </span>
        <span class="arrow">→</span>
      </button>
      <div class="phase-list">
    `;

    for(let p=1; p<=4; p++){
      const info = PHASE_INFO[p];
      const ws = phaseWeeks(p);
      const locked = ws.length === 0;
      const pp = locked ? 0 : Math.round(phaseProgress(p)*100);
      html += `
        <button class="phase-card ${locked?'locked':''}" data-phase="${p}" ${locked?'disabled':''}>
          <div class="phase-shape">${PHASE_SHAPES[p]}</div>
          <div class="phase-meta">
            <div class="num">Phase ${p}</div>
            <div class="title">${info.title}</div>
            <div class="weeks">${info.weeks}${locked?' — content not added yet':''}</div>
          </div>
          <div class="phase-pct">${locked ? '—' : pp+'%'}</div>
        </button>
      `;
    }
    html += `</div>`;
    home.innerHTML = html;

    document.getElementById('continueBtn').onclick = () => openWeek(resumeWeek.week, 'days');
    home.querySelectorAll('.phase-card:not(.locked)').forEach(btn => {
      btn.onclick = () => openPhase(parseInt(btn.dataset.phase, 10));
    });
  }

  // ---------- PHASE VIEW (reuses home container) ----------
  function openPhase(phase){
    document.getElementById('topbar').classList.remove('hidden');
    document.getElementById('weekView').classList.add('hidden');
    document.getElementById('flashView').classList.add('hidden');
    const home = document.getElementById('homeView');
    home.classList.remove('hidden');

    document.getElementById('topTitle').textContent = 'Phase ' + phase + ' — ' + PHASE_INFO[phase].title;
    document.getElementById('topSub').textContent = PHASE_INFO[phase].weeks;
    document.getElementById('backBtn').onclick = renderHome;

    const ws = phaseWeeks(phase);
    const resume = findResumeWeek();
    let html = `<div class="section-title">Weeks</div>`;
    ws.forEach(w => {
      const done = weekIsComplete(w);
      const isCurrent = !done && w.week === resume.week;
      const pct = Math.round(weekProgress(w)*100);
      html += `
        <div class="week-row" data-week="${w.week}" style="cursor:pointer">
          <div class="week-check ${done?'done':(isCurrent?'current':'')}">${done ? '✓' : w.week}</div>
          <div class="week-row-text">
            <div class="t">${w.focus}</div>
            <div class="d">${w.dates}</div>
          </div>
          <div class="week-row-pct">${pct}%</div>
        </div>
      `;
    });
    home.innerHTML = html;
    home.querySelectorAll('.week-row').forEach(row => {
      row.onclick = () => openWeek(parseInt(row.dataset.week,10), 'days');
    });
  }

  // ---------- WEEK VIEW ----------
  const TABS = [
    {id:'days', label:'Day-by-Day'},
    {id:'resources', label:'Resources & Grammar'},
    {id:'vocab', label:'Vocab & Dialogue'},
    {id:'speak', label:'Speaking & Self-Check'},
  ];

  function findWeek(n){ return CURRICULUM.find(w => w.week === n); }

  function openWeek(weekNum, tab){
    const w = findWeek(weekNum);
    if(!w) return;
    STATE.lastWeek = weekNum;
    STATE.lastTab = tab || STATE.lastTab || 'days';
    saveState();

    document.getElementById('homeView').classList.add('hidden');
    document.getElementById('flashView').classList.add('hidden');
    document.getElementById('topbar').classList.remove('hidden');
    document.getElementById('weekView').classList.remove('hidden');

    document.getElementById('topTitle').textContent = 'Week ' + w.week;
    document.getElementById('topSub').textContent = w.dates;
    document.getElementById('backBtn').onclick = () => openPhase(w.phase);

    renderTabbar(w, STATE.lastTab);
    renderWeekHead(w);
    renderTabPanel(w, STATE.lastTab);
  }

  function renderTabbar(w, activeTab){
    const bar = document.getElementById('tabbar');
    bar.innerHTML = TABS.map(t =>
      `<button class="tab ${t.id===activeTab?'active':''}" data-tab="${t.id}">${t.label}</button>`
    ).join('');
    bar.querySelectorAll('.tab').forEach(btn => {
      btn.onclick = () => {
        STATE.lastTab = btn.dataset.tab;
        saveState();
        renderTabbar(w, STATE.lastTab);
        renderTabPanel(w, STATE.lastTab);
      };
    });
  }

  function renderWeekHead(w){
    const pct = Math.round(weekProgress(w)*100);
    document.getElementById('weekHead').innerHTML = `
      <div class="dates">${w.dates}</div>
      <h2>${w.focus}</h2>
      <div class="progress-bar"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
    `;
  }

  function escapeHtml(s){
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function renderTabPanel(w, tab){
    const panel = document.getElementById('weekPanel');
    if(tab === 'days') panel.innerHTML = renderDaysTab(w);
    else if(tab === 'resources') panel.innerHTML = renderResourcesTab(w);
    else if(tab === 'vocab') panel.innerHTML = renderVocabTab(w);
    else panel.innerHTML = renderSpeakTab(w);
    wireInteractive(w, tab);
  }

  function renderDaysTab(w){
    let html = '';
    w.days.forEach((d, di) => {
      const total = d.tasks.length;
      const done = d.tasks.filter((_,ti) => STATE.tasks[dayTaskId(w.week,di,ti)]).length;
      html += `<div class="day-block">
        <div class="day-head">
          <div><span class="name">${d.day}</span><span class="lbl">${escapeHtml(d.label)}</span></div>
          <div class="count">${done}/${total}</div>
        </div>
        <div class="day-tasks">`;
      d.tasks.forEach((t, ti) => {
        const id = dayTaskId(w.week, di, ti);
        const checked = !!STATE.tasks[id];
        html += `<div class="task ${checked?'checked':''}">
          <input type="checkbox" id="${id}" data-id="${id}" ${checked?'checked':''}>
          <label for="${id}">${escapeHtml(t)}</label>
        </div>`;
      });
      html += `</div></div>`;
    });
    if(w.milestone){
      html += `<div class="milestone-box"><b>Milestone</b>${escapeHtml(w.milestone)}</div>`;
    }
    return html;
  }

  function renderResourcesTab(w){
    let html = '<div class="card"><h3>Watch / Do First</h3>';
    if(w.resourceNote) html += `<div class="note-box">${escapeHtml(w.resourceNote)}</div>`;
    html += '<ul class="reslist">' + (w.resources||[]).map(r => `<li>${escapeHtml(r)}</li>`).join('') + '</ul>';
    html += '</div>';

    if((w.grammar||[]).length){
      html += '<div class="card"><h3>Grammar You Need This Week</h3>';
      w.grammar.forEach(g => {
        html += `<div class="gtitle">${escapeHtml(g.title)}</div>`;
        if(g.rows && g.rows.length){
          html += '<table class="gtable">' + g.rows.map(r =>
            `<tr><td>${escapeHtml(r[0])}</td><td>${escapeHtml(r[1]||'')}</td></tr>`
          ).join('') + '</table>';
        }
      });
      if(w.grammarNote) html += `<div class="note-box">${escapeHtml(w.grammarNote)}</div>`;
      html += '</div>';
    }
    return html;
  }

  function renderVocabTab(w){
    let html = '<div class="card"><h3>Core Vocabulary</h3>';
    html += '<table class="vtable">' + (w.vocab||[]).map((v,i) =>
      `<tr><td>${escapeHtml(v[0])}</td><td>${escapeHtml(v[1])}</td><td style="width:34px;text-align:right"><button class="vocab-add-btn" data-vidx="${i}" title="Add to flashcards">+</button></td></tr>`
    ).join('') + '</table>';
    if(w.vocabNote) html += `<div class="note-box" style="margin-top:12px">${escapeHtml(w.vocabNote)}</div>`;
    html += '</div>';

    html += '<div class="card"><h3>Practice Dialogue</h3>';
    (w.dialogue||[]).forEach(line => {
      html += `<div class="dialogue-line"><b>${escapeHtml(line[0])}:</b> ${escapeHtml(line[1])}</div>`;
    });
    html += '</div>';
    return html;
  }

  function renderSpeakTab(w){
    let html = '<div class="card"><h3>Speaking Production (out loud, every session)</h3>';
    (w.speaking||[]).forEach((t, i) => {
      const id = speakTaskId(w.week, i);
      const checked = !!STATE.tasks[id];
      html += `<div class="task ${checked?'checked':''}">
        <input type="checkbox" id="${id}" data-id="${id}" ${checked?'checked':''}>
        <label for="${id}">${escapeHtml(t)}</label>
      </div>`;
    });
    html += '</div>';

    html += '<div class="card"><h3>Self-Check Before Moving On</h3>';
    (w.selfcheck||[]).forEach((t, i) => {
      const id = selfTaskId(w.week, i);
      const checked = !!STATE.tasks[id];
      html += `<div class="task ${checked?'checked':''}">
        <input type="checkbox" id="${id}" data-id="${id}" ${checked?'checked':''}>
        <label for="${id}">${escapeHtml(t)}</label>
      </div>`;
    });
    html += '</div>';

    if(w.milestone){
      html += `<div class="milestone-box"><b>Milestone</b>${escapeHtml(w.milestone)}</div>`;
    }

    html += `<div class="card"><h3>Notes</h3>
      <textarea class="notes-area" id="notesArea" placeholder="Questions, things that tripped you up, phrases you want to remember...">${escapeHtml(STATE.notes[w.week]||'')}</textarea>
    </div>`;
    return html;
  }

  function wireInteractive(w, tab){
    document.getElementById('weekPanel').querySelectorAll('input[type=checkbox]').forEach(cb => {
      cb.onchange = () => {
        STATE.tasks[cb.dataset.id] = cb.checked;
        saveState();
        // re-render current tab + head to update counts/progress bar without losing scroll much
        renderWeekHead(w);
        renderTabPanel(w, tab);
      };
    });
    const notesArea = document.getElementById('notesArea');
    if(notesArea){
      let t;
      notesArea.oninput = () => {
        clearTimeout(t);
        t = setTimeout(() => {
          STATE.notes[w.week] = notesArea.value;
          saveState();
        }, 300);
      };
    }
    if(tab === 'vocab'){
      document.getElementById('weekPanel').querySelectorAll('[data-vidx]').forEach(btn => {
        btn.onclick = () => {
          const idx = parseInt(btn.dataset.vidx, 10);
          const pair = (w.vocab||[])[idx];
          if(!pair) return;
          const col = findOrCreateCollectionByName(`Week ${w.week}`);
          addCard(col.id, pair[0], pair[1]);
          btn.textContent = '✓';
          btn.disabled = true;
        };
      });
    }
  }

  // ---------- FLASHCARDS: home ----------
  function renderFlashHome(){
    document.getElementById('homeView').classList.add('hidden');
    document.getElementById('weekView').classList.add('hidden');
    document.getElementById('topbar').classList.add('hidden');
    const view = document.getElementById('flashView');
    view.classList.remove('hidden');

    const cols = getCollections();
    const totalCards = (STATE.cards||[]).length;

    let html = `<div class="wrap">
      <div class="section-title" style="margin-top:6px">Flashcards</div>
      <button class="continue-btn" id="studyAllBtn" ${totalCards===0?'disabled':''}>
        <span>Study all collections
          <small>${totalCards} card${totalCards===1?'':'s'} total</small>
        </span>
        <span class="arrow">→</span>
      </button>
      <div class="section-title">Collections</div>`;

    if(cols.length === 0){
      html += `<div class="empty-phase"><div class="glyph">+</div><p>No collections yet. Create one below to start adding flashcards — or use the + button next to any week's vocabulary.</p></div>`;
    } else {
      html += `<div class="phase-list">`;
      cols.forEach(c => {
        const n = collectionCardCount(c.id);
        html += `
          <button class="phase-card" data-col="${c.id}">
            <div class="phase-meta">
              <div class="title">${escapeHtml(c.name)}</div>
              <div class="weeks">${n} card${n===1?'':'s'}</div>
            </div>
            <div class="phase-pct">›</div>
          </button>`;
      });
      html += `</div>`;
    }

    html += `
      <button class="continue-btn" id="newColBtn" style="margin-top:16px">
        <span>+ New Collection</span>
      </button>
      <button class="continue-btn" id="studyPickBtn" style="margin-top:10px;background:var(--cream-dim);color:var(--ink);border:1.5px solid var(--ink)" ${cols.length<2?'disabled':''}>
        <span>Study — pick collections</span>
      </button>
    </div>`;

    view.innerHTML = html;

    document.getElementById('newColBtn').onclick = () => {
      const name = window.prompt('Collection name (e.g. "Week 1 Vocab")');
      if(!name || !name.trim()) return;
      const col = addCollection(name);
      openCollection(col.id);
    };
    const studyAllBtn = document.getElementById('studyAllBtn');
    if(studyAllBtn && totalCards>0) studyAllBtn.onclick = () => startStudySession(cols.map(c=>c.id));
    const studyPickBtn = document.getElementById('studyPickBtn');
    if(studyPickBtn && cols.length>=2) studyPickBtn.onclick = () => renderStudyPicker();
    view.querySelectorAll('[data-col]').forEach(btn => {
      btn.onclick = () => openCollection(btn.dataset.col);
    });
  }

  // ---------- FLASHCARDS: manage a collection ----------
  function openCollection(id){
    const col = findCollection(id);
    if(!col) return renderFlashHome();
    document.getElementById('homeView').classList.add('hidden');
    document.getElementById('weekView').classList.add('hidden');
    document.getElementById('flashView').classList.remove('hidden');
    document.getElementById('topbar').classList.remove('hidden');
    document.getElementById('topTitle').textContent = col.name;
    document.getElementById('topSub').textContent = collectionCardCount(col.id) + ' cards';
    document.getElementById('backBtn').onclick = renderFlashHome;
    renderCollectionManage(col);
  }

  function renderCollectionManage(col){
    const view = document.getElementById('flashView');
    const cards = (STATE.cards||[]).filter(c => c.collectionId === col.id);

    let html = `<div class="panel">`;
    html += `<button class="continue-btn" id="studyColBtn" ${cards.length===0?'disabled':''}>
      <span>Study This Collection<small>${cards.length} card${cards.length===1?'':'s'}</small></span>
      <span class="arrow">→</span>
    </button>`;

    html += `<div class="card" style="margin-top:16px"><h3>Add Card</h3>
      <input type="text" id="cardFront" class="fc-input" placeholder="Front (e.g. German word/phrase)">
      <input type="text" id="cardBack" class="fc-input" placeholder="Back (e.g. English meaning)">
      <button class="continue-btn" id="addCardBtn" style="padding:12px 16px"><span>Add Card</span></button>
    </div>`;

    html += `<div class="section-title">Cards</div>`;
    if(cards.length === 0){
      html += `<div class="empty-phase"><p>No cards yet — add your first one above.</p></div>`;
    } else {
      cards.forEach(c => {
        html += `<div class="fc-card-row">
          <div class="f">${escapeHtml(c.front)}</div>
          <div class="b">${escapeHtml(c.back)}</div>
          <div class="actions">
            <button class="fc-smallbtn" data-edit="${c.id}">Edit</button>
            <button class="fc-smallbtn" data-del="${c.id}">Delete</button>
          </div>
        </div>`;
      });
    }

    html += `
      <button class="continue-btn" id="renameColBtn" style="margin-top:16px;background:var(--cream-dim);color:var(--ink);border:1.5px solid var(--ink)"><span>Rename Collection</span></button>
      <button class="continue-btn" id="delColBtn" style="margin-top:10px;background:var(--cream-dim);color:var(--burgundy);border:1.5px solid var(--burgundy)"><span>Delete Collection</span></button>
    </div>`;

    view.innerHTML = html;

    document.getElementById('addCardBtn').onclick = () => {
      const front = document.getElementById('cardFront').value;
      const back = document.getElementById('cardBack').value;
      if(!front.trim() || !back.trim()) return;
      addCard(col.id, front, back);
      openCollection(col.id);
    };
    const studyBtn = document.getElementById('studyColBtn');
    if(studyBtn && cards.length>0) studyBtn.onclick = () => startStudySession([col.id]);

    view.querySelectorAll('[data-edit]').forEach(btn => {
      btn.onclick = () => {
        const c = (STATE.cards||[]).find(x => x.id === btn.dataset.edit);
        if(!c) return;
        const newFront = window.prompt('Front:', c.front);
        if(newFront === null) return;
        const newBack = window.prompt('Back:', c.back);
        if(newBack === null) return;
        updateCard(c.id, newFront, newBack);
        openCollection(col.id);
      };
    });
    view.querySelectorAll('[data-del]').forEach(btn => {
      btn.onclick = () => {
        if(!window.confirm('Delete this card?')) return;
        deleteCard(btn.dataset.del);
        openCollection(col.id);
      };
    });

    document.getElementById('renameColBtn').onclick = () => {
      const name = window.prompt('Rename collection:', col.name);
      if(!name || !name.trim()) return;
      renameCollection(col.id, name);
      openCollection(col.id);
    };
    document.getElementById('delColBtn').onclick = () => {
      if(!window.confirm(`Delete "${col.name}" and all its cards? This can't be undone.`)) return;
      deleteCollection(col.id);
      renderFlashHome();
    };
  }

  // ---------- FLASHCARDS: pick multiple collections to study ----------
  function renderStudyPicker(){
    document.getElementById('homeView').classList.add('hidden');
    document.getElementById('weekView').classList.add('hidden');
    document.getElementById('flashView').classList.remove('hidden');
    document.getElementById('topbar').classList.remove('hidden');
    document.getElementById('topTitle').textContent = 'Choose Collections';
    document.getElementById('topSub').textContent = 'Study across multiple sets';
    document.getElementById('backBtn').onclick = renderFlashHome;

    const view = document.getElementById('flashView');
    const cols = getCollections();
    let html = `<div class="panel">`;
    cols.forEach(c => {
      const n = collectionCardCount(c.id);
      html += `<div class="task">
        <input type="checkbox" id="pick-${c.id}" data-pick="${c.id}">
        <label for="pick-${c.id}">${escapeHtml(c.name)} <span style="opacity:.6">(${n})</span></label>
      </div>`;
    });
    html += `<button class="continue-btn" id="startPickedBtn" style="margin-top:18px"><span>Start Studying</span></button>`;
    html += `</div>`;
    view.innerHTML = html;

    document.getElementById('startPickedBtn').onclick = () => {
      const ids = Array.from(view.querySelectorAll('[data-pick]:checked')).map(cb => cb.dataset.pick);
      if(ids.length === 0) return;
      startStudySession(ids);
    };
  }

  // ---------- FLASHCARDS: study session ----------
  let STUDY = null;
  function startStudySession(collectionIds){
    const cards = shuffle(getCardsFor(collectionIds).slice());
    if(cards.length === 0) return;
    STUDY = {queue: cards, pos: 0, missed: [], total: cards.length, pass: 1};
    renderStudySession();
  }

  function renderStudySession(){
    document.getElementById('homeView').classList.add('hidden');
    document.getElementById('weekView').classList.add('hidden');
    document.getElementById('flashView').classList.remove('hidden');
    document.getElementById('topbar').classList.remove('hidden');
    document.getElementById('topTitle').textContent = 'Studying';
    document.getElementById('backBtn').onclick = () => { STUDY = null; renderFlashHome(); };

    if(!STUDY || STUDY.pos >= STUDY.queue.length){
      return renderStudyEnd();
    }

    const card = STUDY.queue[STUDY.pos];
    document.getElementById('topSub').textContent =
      `Card ${STUDY.pos+1} of ${STUDY.queue.length}${STUDY.pass>1 ? ' — round '+STUDY.pass : ''}`;

    const view = document.getElementById('flashView');
    let html = `<div class="panel">
      <div class="progress-bar"><div class="progress-bar-fill" style="width:${Math.round((STUDY.pos/STUDY.queue.length)*100)}%"></div></div>
      <div class="card study-card" id="studyCard">
        <div>
          <div class="lbl" id="studySideLabel">Front — tap to flip</div>
          <div class="txt" id="studyCardText">${escapeHtml(card.front)}</div>
        </div>
      </div>
      <div class="study-answer-row hidden" id="studyAnswerBtns">
        <button class="continue-btn" id="missedBtn" style="background:var(--cream-dim);color:var(--ink);border:1.5px solid var(--ink);flex:1"><span>Missed it</span></button>
        <button class="continue-btn" id="gotBtn" style="background:var(--green);flex:1"><span>Got it</span></button>
      </div>
    </div>`;
    view.innerHTML = html;

    let flipped = false;
    document.getElementById('studyCard').onclick = () => {
      if(flipped) return;
      flipped = true;
      document.getElementById('studySideLabel').textContent = 'Back';
      document.getElementById('studyCardText').textContent = card.back;
      document.getElementById('studyAnswerBtns').classList.remove('hidden');
    };
    document.getElementById('gotBtn').onclick = (e) => {
      e.stopPropagation();
      STUDY.pos++;
      renderStudySession();
    };
    document.getElementById('missedBtn').onclick = (e) => {
      e.stopPropagation();
      STUDY.missed.push(card);
      STUDY.pos++;
      renderStudySession();
    };
  }

  function renderStudyEnd(){
    document.getElementById('topSub').textContent = 'Session complete';
    const view = document.getElementById('flashView');
    const missedCount = STUDY.missed.length;
    const total = STUDY.total;
    let html = `<div class="panel">
      <div class="card" style="text-align:center;padding:30px 16px">
        <h3 style="text-transform:none;font-size:18px;margin-bottom:6px">Round ${STUDY.pass} complete</h3>
        <div style="font-size:13px;opacity:.75">${total - missedCount} of ${total} correct on this pass</div>
      </div>`;
    if(missedCount > 0){
      html += `<button class="continue-btn" id="retryMissedBtn"><span>Review ${missedCount} Missed Card${missedCount===1?'':'s'}<small>Try them again</small></span><span class="arrow">→</span></button>`;
    }
    html += `<button class="continue-btn" id="doneStudyBtn" style="margin-top:10px;background:var(--cream-dim);color:var(--ink);border:1.5px solid var(--ink)"><span>Done</span></button>`;
    html += `</div>`;
    view.innerHTML = html;

    const retryBtn = document.getElementById('retryMissedBtn');
    if(retryBtn){
      retryBtn.onclick = () => {
        STUDY = {queue: shuffle(STUDY.missed.slice()), pos: 0, missed: [], total: STUDY.missed.length, pass: STUDY.pass+1};
        renderStudySession();
      };
    }
    document.getElementById('doneStudyBtn').onclick = () => { STUDY = null; renderFlashHome(); };
  }

  // ---------- boot ----------
  showSection('curriculum');
  document.querySelectorAll('#bottomNav .navbtn').forEach(btn => {
    btn.onclick = () => showSection(btn.dataset.section);
  });

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
})();
</script>
</body>
</html>
